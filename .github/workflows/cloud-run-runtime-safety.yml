name: Cloud Run Runtime Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/deployment_readiness.py"
      - "backend/runtime_instance_guard.py"
      - "backend/runtime_lifecycle.py"
      - "backend/cloud_run_server.py"
      - "Dockerfile.cloudrun"
      - ".dockerignore"
      - ".env.example"
      - "cloudbuild.yaml"
      - "docs/CLOUD_RUN_DEPLOYMENT.md"
      - "tests/test_cloud_run_runtime_safety.py"
      - "tests/test_cloud_run_deployment_readiness.py"
      - ".github/workflows/cloud-run-runtime-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudrun
          POSTGRES_PASSWORD: cloudrun
          POSTGRES_DB: bybit_cloudrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudrun -d bybit_cloudrun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Compile and import Cloud Run runtime
        run: |
          python -m py_compile \
            backend/deployment_readiness.py \
            backend/runtime_instance_guard.py \
            backend/runtime_lifecycle.py \
            backend/cloud_run_server.py
          python -c "import backend.cloud_run_server"

      - name: Run focused safety tests
        run: >-
          python -m pytest -q
          tests/test_cloud_run_runtime_safety.py
          tests/test_cloud_run_deployment_readiness.py

      - name: Verify container contract
        run: |
          grep -F 'CMD ["python", "-m", "backend.cloud_run_server"]' Dockerfile.cloudrun
          grep -F 'PYTHONPATH=/app:/app/backend' Dockerfile.cloudrun
          grep -F 'EXPOSE 8080' Dockerfile.cloudrun
          grep -F 'USER app' Dockerfile.cloudrun
          grep -F 'STOPSIGNAL SIGTERM' Dockerfile.cloudrun
          grep -F 'pg_try_advisory_lock' backend/runtime_instance_guard.py
          grep -F 'signal.SIGTERM' backend/runtime_lifecycle.py
          grep -F '"/healthz"' backend/cloud_run_server.py
          grep -F '"/readyz"' backend/cloud_run_server.py
          grep -F '.env' .dockerignore

      - name: Build Cloud Run image
        run: docker build -f Dockerfile.cloudrun -t bybit-backend-cloudrun:test .

      - name: Start non-root image and verify probes
        env:
          DATABASE_URL: postgresql://cloudrun:cloudrun@127.0.0.1:5432/bybit_cloudrun
        run: |
          set -euo pipefail
          cleanup() {
            docker logs bybit-cloudrun-smoke || true
            docker rm -f bybit-cloudrun-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name bybit-cloudrun-smoke \
            --network host \
            -e ADMIN_TOKEN="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            -e BYBIT_API_KEY="ci_demo_key_123456" \
            -e BYBIT_API_SECRET="ssssssssssssssssssssssssssssssss" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BYBIT_BASE_URL="https://api-demo.bybit.com" \
            -e BOT_EXECUTION_ENABLED="false" \
            -e CORS_ALLOWED_ORIGINS="https://frontend.example.test" \
            -e PUBLIC_BASE_URL="https://backend.example.test" \
            -e HOST="0.0.0.0" \
            -e PORT="8080" \
            bybit-backend-cloudrun:test

          test "$(docker exec bybit-cloudrun-smoke id -u)" != "0"

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8080/healthz
          curl --fail --show-error http://127.0.0.1:8080/readyz
