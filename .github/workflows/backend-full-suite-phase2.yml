name: Backend Full Suite Phase 2

on:
  push:
    branches:
      - fix/backend-test-stabilization-phase2
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/backend-full-suite-phase2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phase2
          POSTGRES_PASSWORD: phase2
          POSTGRES_DB: bybit_phase2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase2 -d bybit_phase2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://phase2:phase2@localhost:5432/bybit_phase2
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      BYBIT_BASE_URL: https://api-demo.bybit.com
      BOT_EXECUTION_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q backend tests

      - name: Run complete backend test suite
        run: python -m pytest -q --tb=short
