name: Strict Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BYBIT_BASE_URL: https://api-demo.bybit.com
      BYBIT_API_KEY: ""
      BYBIT_API_SECRET: ""
      ADMIN_TOKEN: ci-admin-token-not-for-production
      TIMEZONE: Asia/Dhaka
      BOT_STATE_DB_PATH: ${{ runner.temp }}/bybit-bot-state.sqlite3
      BOT_JOURNAL_PATH: ${{ runner.temp }}/trade-journal.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend app scripts tests

      - name: Scan tracked files for committed secrets
        run: python scripts/ci_secret_scan.py

      - name: Verify canonical runtime installation
        run: |
          python - <<'PY'
          import backend.secure_server as secure_server

          secure_server.install_secure_runtime()
          assert secure_server.core.bot_tick is not None
          assert secure_server.core.durable_state_status()["ok"] is True
          print("Canonical secure runtime installation passed.")
          PY

      - name: Run complete pytest suite
        run: python -m pytest -q
