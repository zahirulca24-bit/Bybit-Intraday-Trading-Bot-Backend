name: Strategy Step 1 CI

on:
  pull_request:
    paths:
      - "backend/strategy_step1_upgrade.py"
      - "backend/runtime_orchestrator.py"
      - "tests/test_strategy_step1_upgrade.py"
      - ".github/workflows/strategy-step1-ci.yml"
  workflow_dispatch:

jobs:
  verify-step1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Step 1 tests
        run: python -m pytest -q tests/test_strategy_step1_upgrade.py
      - name: Compile Step 1 runtime files
        run: python -m py_compile backend/strategy_step1_upgrade.py backend/runtime_orchestrator.py
