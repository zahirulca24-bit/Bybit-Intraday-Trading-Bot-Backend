name: Strategy Analytics CI

on:
  pull_request:
    paths:
      - "backend/analytics_runtime.py"
      - "backend/secure_server.py"
      - "backend/tests/test_analytics_runtime.py"
      - ".github/workflows/strategy-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile analytics runtime
        run: python -m compileall -q backend/analytics_runtime.py backend/secure_server.py

      - name: Run analytics tests
        run: python -m pytest backend/tests/test_analytics_runtime.py -q
