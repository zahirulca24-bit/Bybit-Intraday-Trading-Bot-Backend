name: Kill Switch verification

on:
  pull_request:
    paths:
      - "backend/guarded_server.py"
      - "backend/kill_switch_verification.py"
      - "backend/tests/test_kill_switch_verification.py"
      - ".github/workflows/kill-switch-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kill-switch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run focused Kill Switch tests
        run: python -m pytest -q backend/tests/test_kill_switch_verification.py

      - name: Compile guarded runtime
        run: python -m py_compile backend/guarded_server.py backend/kill_switch_verification.py
