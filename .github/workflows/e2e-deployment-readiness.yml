name: E2E Deployment Readiness Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deployment/verify_e2e_readiness.py'
      - 'node_execution/src/httpServer.js'
      - 'node_execution/test/**'
      - '.github/workflows/e2e-deployment-readiness.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node execution tests
        working-directory: node_execution
        run: npm ci && npm test
      - name: Compile readiness verifier
        run: python -m py_compile deployment/verify_e2e_readiness.py

  deployed-readiness:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-tests
    runs-on: ubuntu-latest
    environment: deployment-readiness
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed topology without mutations
        env:
          FRONTEND_PUBLIC_URL: ${{ secrets.FRONTEND_PUBLIC_URL }}
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
          NODE_EXECUTION_PUBLIC_URL: ${{ secrets.NODE_EXECUTION_PUBLIC_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: python deployment/verify_e2e_readiness.py | tee deployment-readiness-report.json
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-readiness-evidence
          path: deployment-readiness-report.json
          retention-days: 30
