name: Replay Strategy Risk CI

on:
  pull_request:
    paths:
      - "backend/replay_strategy_risk.py"
      - "backend/replay_engine.py"
      - "backend/tests/test_replay_strategy_risk.py"
      - ".github/workflows/replay-strategy-risk-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/replay_strategy_risk.py"
      - "backend/replay_engine.py"
      - "backend/tests/test_replay_strategy_risk.py"

permissions:
  contents: read

jobs:
  replay-strategy-risk:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile replay strategy runtime
        run: python -m compileall -q backend/replay_strategy_risk.py backend/replay_engine.py
      - name: Run strategy and replay regression tests
        run: |
          python -m pytest \
            backend/tests/test_replay_strategy_risk.py \
            backend/tests/test_replay_engine.py \
            tests/test_replay_safety.py \
            -q
      - name: Verify no execution imports
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/replay_strategy_risk.py').read_text()
          forbidden = ['bybit_request', 'place_order', 'submit_order', 'api-demo.bybit.com']
          assert not any(token in source for token in forbidden), source
          assert 'externalExecutionAllowed' in source
          assert 'executionSimulated' in source
          PY
